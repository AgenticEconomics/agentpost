# AgentPost — pull-only compose (no local build)
# Use this file when running pre-built images from ghcr.io.
# Copy to your instance directory and configure .env.
#
# Usage:
#   cp docker-compose.pull.yml docker-compose.yml
#   cp .env.example .env   # then edit .env
#   docker compose up -d

name: ${INSTANCE_NAME:-agentpost}

services:
  api:
    image: ${IMAGE_REGISTRY:-ghcr.io/agentic economics}/agentpost-api:${IMAGE_TAG:-0.1.0}
    container_name: ${INSTANCE_NAME:-agentpost}-api
    restart: unless-stopped
    environment:
      AGENTPOST_ROOT: /var/lib/agentpost
      AGENTPOST_DOMAIN: ${AGENTPOST_DOMAIN:-agentpost.local}
      AGENTPOST_API_HOST: 0.0.0.0
      AGENTPOST_API_PORT: "8765"
      AGENTPOST_OPERATOR_TOKEN: ${AGENTPOST_OPERATOR_TOKEN:?set AGENTPOST_OPERATOR_TOKEN in .env}
      AGENTPOST_AUTO_INIT: "true"
    volumes:
      - instance-data:/var/lib/agentpost
    ports:
      - "${API_PORT:-8765}:8765"
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8765/api/v1/health').raise_for_status()"]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 8s
    networks:
      - instance-net

  web:
    image: ${IMAGE_REGISTRY:-ghcr.io/agentic economics}/agentpost-web:${IMAGE_TAG:-0.1.0}
    container_name: ${INSTANCE_NAME:-agentpost}-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-58080}:80"
    networks:
      - instance-net

volumes:
  instance-data:
    name: ${INSTANCE_NAME:-agentpost}-data

networks:
  instance-net:
    name: ${INSTANCE_NAME:-agentpost}-net
